# See https://pre-commit.com/hooks.html for more hooks
# See https://pre-commit.com for more information

# WHY THERE ARE NO PYTHON INTERPRETER PINS HERE
# ---------------------------------------------
# Some hooks below (commitizen, sync-pre-commit-deps) are `language: python`
# and require Python >= 3.10. Their upstream manifests declare
# `language_version: python3`, and pre-commit resolves that to *the interpreter
# running pre-commit itself* (see `_sys_executable_matches` in
# pre_commit/languages/python.py) — not to whatever `python3` is on PATH.
#
# So the interpreter these hooks build against is decided by how pre-commit is
# installed, not by anything in this file. `make setup` installs pre-commit into
# a repo-local virtualenv (.venv/) built from a Python >= 3.10, and the hook
# scripts in .githooks/ invoke that copy — so the hooks always get a supported
# interpreter without pinning a `language_version` here and without requiring a
# particular global Python.
#
# The failure mode this replaces: a globally installed pre-commit running under
# an old interpreter (e.g. macOS's Python 3.9) builds these hook environments
# with 3.9 and fails with `requires a different Python`. Previously the template
# worked around that with a per-hook `language_version: python3.10`, which
# forced every contributor to install that exact version globally. If you hit
# that error now, it means the hooks are being run by a pre-commit outside
# .venv/ — see the README's Troubleshooting section.
repos:
  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: v0.0.4
    hooks:
    -   id: sync-pre-commit-deps
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        # Two trailing spaces are a hard line break in Markdown. Without
        # this, the hook strips them and silently reflows prose docs. This
        # template's own files happen to have none, but a project's will.
        args: ["--markdown-linebreak-ext=md,markdown"]
    -   id: end-of-file-fixer
        # THE .NET SDK WRITES THESE TWO FILES AND DOES NOT END THEM WITH A
        # NEWLINE. `dotnet restore` rewrites packages.lock.json whenever the
        # resolved graph changes, and `dotnet tool install/update` rewrites
        # .config/dotnet-tools.json; both leave the closing `}` as the last
        # byte. Nothing in this repository decides that, so the hook and the
        # SDK disagree permanently.
        #
        # THE FAILURE MODE THIS REPLACES: a human's commit looks clean, because
        # this hook appends the newline on the way in, so the committed file is
        # fixed before anyone sees it. Dependabot's updater never runs
        # pre-commit, so its regenerated lock files arrive raw and `make ci`
        # fails with `files were modified by this hook` on a file no human
        # wrote and no human can keep fixed -- on every NuGet bump, forever.
        # Dependabot cannot be taught to run the hook, and no .gitattributes
        # setting helps: text normalisation rewrites CRLF, it cannot append a
        # missing final newline.
        #
        # Named file by file rather than by extension, so a hand-written JSON
        # file missing its final newline is still caught.
        exclude: (^|/)(packages\.lock\.json|\.config/dotnet-tools\.json)$
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-case-conflict
    -   id: check-illegal-windows-names
    -   id: check-merge-conflict
    -   id: detect-private-key
    -   id: fix-byte-order-marker
    -   id: mixed-line-ending
  # SPELL CHECKING MARKDOWN — TWO TOOLS, ON PURPOSE
  # -----------------------------------------------
  # Documentation is the part of a repository nobody compiles, so a typo in it
  # survives every other check. Both hooks below are scoped to
  # `types: [markdown]`. They are complementary, not redundant:
  #
  #   codespell matches a curated list of ~40k known typos against the WHOLE
  #     file, code blocks included. It cannot invent a correction, so it is
  #     safe to point at code and effectively never fires falsely — but it
  #     only knows typos someone has already catalogued. They look like this:
  #     "teh", "definately".  codespell:ignore teh,definately
  #
  #     That trailing directive exempts those two examples, and only that one
  #     line — naming an example typo is indistinguishable from making one. It
  #     is inert while this hook is markdown-only, and keeps this comment from
  #     failing the check if you widen the scope as described below.
  #
  #   cspell checks every word against a real dictionary, so it also catches
  #     one-off misspellings codespell has never heard of. That power is also
  #     its cost: pointed at code it flags identifiers, CLI flags and file
  #     paths. So cspell.json checks prose only, excluding code spans, fenced
  #     blocks, link targets and HTML comments — see that file for each why.
  #
  # Net effect: prose gets full dictionary coverage, code blocks still get the
  # high-confidence typo sweep, and neither hook blocks a PR over an
  # identifier. Markdown is the conservative default for a template, since it
  # is the one file type every repo made from this one is certain to have; to
  # spell-check every text file too (YAML comments, shell scripts, the
  # Makefile, and in a real project its source), drop the `types` override.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        types: [markdown]
        # No `.codespellrc`, deliberately. The one exemption this repo needs —
        # the example typos in the README's spell-checking table, and in the
        # comment above — is line-scoped with a `codespell:ignore` directive
        # instead. Prefer that: a repo-wide `ignore-words-list` stops that
        # typo being caught *everywhere*, which for a real typo is backwards.
        # If a project does need the file, it takes INI comments, so record
        # WHY each word is in it.
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.4.0
    hooks:
      - id: cspell
        types: [markdown]
        # Upstream's `args` end in `--files`, which must stay last for paths to
        # be passed correctly — so this hook deliberately does not override
        # `args`. All tuning lives in cspell.json instead.
        #
        # This is the only `language: node` hook here, and it needs no new
        # prerequisite: pre-commit provisions the runtime itself through
        # nodeenv, so the README's requirements list stays as short as it is.
        #
        # That runtime is pinned for the same reason CI pins Python: without a
        # `language_version` pre-commit silently uses whatever `node` is on
        # PATH, so the checker runs on a different runtime per machine. Bump
        # deliberately; remove this line to use the system node instead.
        language_version: "24.22.2"
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1  # Specify the desired version of Gitleaks
    hooks:
      - id: gitleaks
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.3
    hooks:
     -  id: commitizen
        stages: [commit-msg]
  # Builds and tests the staged tree with `make test`, which depends on `make build` and uses the
  # Release configuration. Analyzer findings are only errors in Release (see TreatWarningsAsErrors
  # in Directory.Build.props): development builds default to Debug and merely warn, so this hook is
  # the point where a warning has to be dealt with rather than deferred. pre-commit stashes unstaged
  # work before running hooks, so what gets compiled and tested is exactly what is about to be
  # committed.
  #
  # `files` keeps commits that touch no build input — documentation, the git hooks, CI YAML — from
  # paying for a build and test run.
  #
  # `make lint` skips this hook (see LINT_SKIP_HOOKS in the Makefile) because `make ci` already runs
  # the build and test targets itself.
  - repo: local
    hooks:
      - id: dotnet-build-test
        name: dotnet build + test (Release, analyzer findings are errors)
        entry: make test
        language: system
        pass_filenames: false
        files: \.(cs|csproj|slnx|props|targets|json)$
      - id: dotnet-analyzers-verify
        name: verify generated .NET analyzer rules
        entry: make analyzers-verify
        language: system
        pass_filenames: false
        files: '(\.(csproj|slnx|sln|props|targets)$|(^|/)(packages\.lock\.json|global\.json)$|^eng/analyzers/(sync-rules\.cs|all-rules\.globalconfig)$)'
