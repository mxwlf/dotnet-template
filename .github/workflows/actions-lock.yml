name: Actions lockfile
on:
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "29 5 * * 3"
permissions:
  contents: read
jobs:
  actions-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install actions-lock extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify workflow dependency lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify --no-interactive
