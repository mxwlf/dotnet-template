# ---------------------------------------------------------------------------
# GitHub Actions CI — THIN WRAPPER
# ---------------------------------------------------------------------------
# This workflow deliberately contains no build logic. It only:
#   1. checks out the code,
#   2. provides a Python interpreter,
#   3. runs `make ci`.
#
# `make ci` builds the repo-local virtualenv (.venv/) from that interpreter and
# installs the pinned `pre-commit` from requirements-dev.txt into it, exactly as
# a developer's `make setup` does — so there is nothing to install globally here.
#
# All actual checks live in the Makefile (`make ci`) and run identically on a
# developer laptop. To change WHAT runs in CI, edit the Makefile and
# .pre-commit-config.yaml — not this file. The only things that belong here are
# platform-specific concerns that cannot live in a portable script: triggers,
# the runner image, and prerequisite installation.
#
# Determinism: tool versions are pinned (Python below; `pre-commit` in
# requirements-dev.txt; hook versions via `rev` in .pre-commit-config.yaml).
# Bump them deliberately.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Interpreter used to build .venv. Any version >= 3.10 works (see
      # MIN_PYTHON in the Makefile); it is pinned here only for reproducible
      # runs, not because the hooks need this exact version.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The .NET SDK. Unlike the Python version above, this is not a free choice:
      # global-json-file points the action at the same global.json that the build
      # itself resolves through, so CI compiles with exactly the pinned SDK and
      # `make check-dotnet` cannot fail here. The action would also discover a
      # root global.json on its own, but naming it keeps the coupling explicit.
      #
      # This step exists for the same reason setup-python does: installing a
      # prerequisite toolchain is a runner concern that cannot live in a portable
      # script. The Makefile only *verifies* the SDK (`make check-dotnet`); it
      # deliberately never installs one.
      #
      # cache/cache-dependency-path cache the NuGet global-packages folder, the
      # direct analogue of the pre-commit cache below. The key is a hash of every
      # packages.lock.json, which RestorePackagesWithLockFile (Directory.Build.props)
      # guarantees exists and keeps committed, so the key only moves when a
      # dependency actually changes. The glob is quoted because a leading `*` would
      # otherwise be read as a YAML alias.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Cache pre-commit hook environments keyed on the config so unchanged
      # hooks are not rebuilt on every run.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The single entrypoint. Everything CI does is defined in the Makefile.
      - run: make ci
