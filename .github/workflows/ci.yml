# ---------------------------------------------------------------------------
# GitHub Actions CI — THIN WRAPPER
# ---------------------------------------------------------------------------
# This workflow deliberately contains no build logic. It only:
#   1. checks out the code,
#   2. provides a Python interpreter,
#   3. runs `make ci`.
#
# `make ci` builds the repo-local virtualenv (.venv/) from that interpreter and
# installs the pinned `pre-commit` from requirements-dev.txt into it, exactly as
# a developer's `make setup` does — so there is nothing to install globally here.
#
# All actual checks live in the Makefile (`make ci`) and run identically on a
# developer laptop. To change WHAT runs in CI, edit the Makefile and
# .pre-commit-config.yaml — not this file. The only things that belong here are
# platform-specific concerns that cannot live in a portable script: triggers,
# the runner image, and prerequisite installation.
#
# Determinism: tool versions are pinned (Python below; `pre-commit` in
# requirements-dev.txt; hook versions via `rev` in .pre-commit-config.yaml).
# Bump them deliberately.
name: ci

on:
  push:
    branches: [main, develop]
  # Both long-lived branches are covered, not just develop: the test reporter annotates failed and
  # skipped tests on the pull request's own "Files changed" diff, and a pull request that never
  # triggers a run gets none of that.
  pull_request:
    branches: [main, develop]

# Least privilege for the automatically provisioned GITHUB_TOKEN, and the narrowest set that still
# works: checkout reads the repository, and nothing else here touches the API. The test reporter
# needs no token at all — annotations, log groups and the job summary are workflow commands written
# to stdout and to $GITHUB_STEP_SUMMARY, not API calls — and actions/cache is likewise unaffected.
# Stating this closes the CodeQL actions/missing-workflow-permissions finding, which fires on the
# default token being left at whatever the repository hands out.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Interpreter used to build .venv. Any version >= 3.10 works (see
      # MIN_PYTHON in the Makefile); it is pinned here only for reproducible
      # runs, not because the hooks need this exact version.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The .NET SDK. Unlike the Python version above, this is not a free choice:
      # global-json-file points the action at the same global.json that the build
      # itself resolves through, so CI compiles with exactly the pinned SDK and
      # `make check-dotnet` cannot fail here. The action would also discover a
      # root global.json on its own, but naming it keeps the coupling explicit.
      #
      # This step exists for the same reason setup-python does: installing a
      # prerequisite toolchain is a runner concern that cannot live in a portable
      # script. The Makefile only *verifies* the SDK (`make check-dotnet`); it
      # deliberately never installs one.
      #
      # cache/cache-dependency-path cache the NuGet global-packages folder, the
      # direct analogue of the pre-commit cache below. The key is a hash of every
      # packages.lock.json, which RestorePackagesWithLockFile (Directory.Build.props)
      # guarantees exists and keeps committed, so the key only moves when a
      # dependency actually changes. The glob is quoted because a leading `*` would
      # otherwise be read as a YAML alias.
      #
      # The tool manifest is hashed alongside them because `make coverage` restores
      # the pinned local tools into that same folder, and nothing else in the key
      # moves when a tool version is bumped.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            .config/dotnet-tools.json

      # Cache pre-commit hook environments keyed on the config so unchanged
      # hooks are not rebuilt on every run.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The historical context the test report attaches to each reported failure ("failed 2 of 3
      # prior runs") comes from a small snapshot that `make test` reads before the run and rewrites
      # afterwards (TEST_HISTORY_DIR in the Makefile). The reporter deliberately does not move that
      # file between runs, so the workflow has to — which is exactly the kind of platform-specific
      # plumbing that belongs here rather than in the Makefile. A cache is the vehicle instead of an
      # artifact because artifacts are scoped to the run that produced them and would have to be
      # hunted down through the API.
      #
      # restore and save are separate steps rather than the combined actions/cache used above for
      # two reasons: the combined action saves only when the job succeeds, and a failing run is
      # precisely the one whose outcome the next run needs; and a save is rejected when its key
      # already exists, so the key has to move every run. Hence the rolling run_id key paired with a
      # prefix restore-key, which resolves to the most recent earlier snapshot.
      - uses: actions/cache/restore@v6
        with:
          path: artifacts/test-history
          key: gh-test-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: gh-test-history-${{ runner.os }}-

      # The single entrypoint. Everything CI does is defined in the Makefile.
      - run: make ci

      # What the reporter writes to the job summary is a rendering; these are the files. The TRX report
      # and the merged Cobertura report otherwise live and die on the runner, since artifacts/ is
      # gitignored — so without this step there is no way to open a test result, feed coverage to
      # another tool, or compare two runs after the fact.
      #
      # always(), for the same reason the history cache below is saved unconditionally: the run whose
      # reports someone wants to download is the red one. if-no-files-found stays at a warning because
      # `make ci` legitimately produces nothing here when it stops in `lint`, before any test runs.
      #
      # No permissions block is needed: the artifact API is reached with the runner's own artifact
      # token, not the GITHUB_TOKEN scoped at the top of this file. The Html report inside the zip is
      # browsable only after downloading; serving it in place would mean GitHub Pages, which is a
      # publishing decision this template does not make for its consumers.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-reports
          path: |
            artifacts/test-results/
            artifacts/coverage/
          if-no-files-found: warn
          # Matched to TEST_HISTORY_WINDOW_DAYS in the Makefile, so a failure's report is still
          # downloadable for as long as the summary keeps claiming it happened.
          retention-days: 30

      # always(), because a red run is the one whose outcome most needs recording: without it the
      # history would be a record of green runs only, and no failure would ever look repeated.
      # continue-on-error, because the snapshot is a nicety in a job summary and must never be the
      # thing that fails a build — it is legitimately absent when `make ci` stopped in `lint`, before
      # any test ran.
      - uses: actions/cache/save@v6
        if: always()
        continue-on-error: true
        with:
          path: artifacts/test-history
          key: gh-test-history-${{ runner.os }}-${{ github.run_id }}
