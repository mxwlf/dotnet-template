# ---------------------------------------------------------------------------
# Publish to nuget.org — TAG TRIGGERED
# ---------------------------------------------------------------------------
# Deliberately separate from ci.yml. CI runs on every pull request and is held at
# `contents: read`; publishing needs `id-token: write` to mint an OIDC token, and nothing that
# runs on untrusted input should ever hold that. Separating them also means a package is only
# ever produced by an explicit version tag, never by a merge.
#
# Trusted publishing (OIDC) rather than a long-lived NUGET_API_KEY: NuGet/login exchanges this
# workflow's OIDC identity for a token valid about an hour, so there is no secret to rotate or
# leak. nuget.org matches the exchange against a policy naming this repository AND THE EXACT
# FILENAME OF THIS FILE — renaming it from `publish.yml` breaks publishing with "no matching
# policy" until the policy is updated to match.
#   https://www.nuget.org/account/trustedpublishing
#
# The one secret still needed is NUGET_USER, the nuget.org *username* (not the email address),
# scoped to the `release` environment rather than the repository.
name: publish

on:
  push:
    tags:
      # nbgv's publicReleaseRefSpec in version.json marks the same shape of ref as a public
      # release, which is what strips the -g<commit> suffix. Keep the two in step.
      - "v*"

# The default for every job. The publish job widens its own; nothing else here needs more.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Scopes NUGET_USER to this environment and gives somewhere to hang an approval gate. The
    # nuget.org policy must name this environment too, or the token exchange is rejected.
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC token for NuGet trusted publishing — NuGet/login 403s without it
      attestations: write # attest the artifact this run is about to push

    steps:
      # fetch-depth: 0 because the version is derived from git history: nbgv counts the commits
      # since version.json last changed its version field. The action's default depth-1 clone
      # makes nbgv throw outright, not merely miscount.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # A tag is a claim about a version; this checks the claim against the version the build
      # will actually stamp. Without it a mistyped tag publishes a package whose number does not
      # match its own ref, and NuGet versions cannot be recalled.
      - name: Verify the tag matches the computed version
        run: |
          make tools
          computed="$(dotnet nbgv get-version --variable NuGetPackageVersion)"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag computed=$computed"
          if [ "$computed" != "$tag" ]; then
            echo "::error::Tag '$tag' does not match the computed version '$computed'."
            exit 1
          fi

      # A NuGet package id can never be renamed, deleted or reused — only unlisted. This repository's
      # id sits under the reserved `mxwlf.*` prefix, so a copy of this template that tags without
      # changing it would be rejected by nuget.org for publishing into someone else's reserved
      # namespace. That rejection arrives late and reads cryptically, so fail here instead with an
      # explanation. The check is exact on both id and repository, so it cannot false-positive on a
      # legitimately different id.
      - name: Refuse to publish this template's own package id from a fork
        run: |
          id="$(dotnet msbuild src/library.example/library.example.csproj -getProperty:PackageId)"
          echo "PackageId=$id  repository=$GITHUB_REPOSITORY"
          if [ "$id" = "mxwlf.net.library.example" ] && [ "$GITHUB_REPOSITORY" != "mxwlf/dotnet-template" ]; then
            echo "::error::PackageId is still '$id', which belongs to the dotnet-template author and"
            echo "::error::sits under the reserved prefix 'mxwlf.*'. Set your own PackageId before"
            echo "::error::tagging — NuGet ids are permanent and cannot be renamed or deleted."
            exit 1
          fi

      # The same entrypoint CI uses, so a package is never published without passing the checks
      # that gate a merge. This produces artifacts/package/<config>/ and the SBOM.
      - run: make ci

      # Attest the artifact THIS run produced, before pushing it. An attestation binds a digest,
      # so it must be generated against the exact bytes that go to nuget.org. Re-packing after
      # attesting — or attesting a different run's output — leaves claims that silently do not
      # apply to the package anyone installs.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/package/release/*.nupkg
            artifacts/package/release/*.snupkg

      - uses: actions/attest-sbom@v4
        with:
          subject-path: |
            artifacts/package/release/*.nupkg
            artifacts/package/release/*.snupkg
          sbom-path: artifacts/sbom/_manifest/spdx_2.2/manifest.spdx.json

      # Immediately before the push: the token this returns is short-lived, so a login placed
      # earlier in a long job can expire before it is used.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org username, NOT the email address

      # --skip-duplicate makes a re-run idempotent instead of failing on a version that already
      # exists. The matching .snupkg is pushed automatically alongside the .nupkg; --no-symbols
      # would opt out.
      - name: Push to nuget.org
        run: >
          dotnet nuget push artifacts/package/release/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
