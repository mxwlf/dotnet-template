name: Security
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
jobs:
  dependency-review:
    # Public repositories support dependency review; private repositories must
    # opt in only after verifying feature availability and dependency graph setup.
    if: github.event_name == 'pull_request' && (!github.event.repository.private || vars.ENABLE_DEPENDENCY_REVIEW == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate reviewed exceptions
        id: exceptions
        run: |
          advisories="$(python3 eng/scripts/security_exceptions.py)"
          echo "advisories=$advisories" >> "$GITHUB_OUTPUT"
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          allow-ghsas: ${{ steps.exceptions.outputs.advisories }}
  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
