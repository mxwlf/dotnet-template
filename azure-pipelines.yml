# ---------------------------------------------------------------------------
# Azure DevOps Pipeline — THIN WRAPPER
# ---------------------------------------------------------------------------
# This pipeline deliberately contains no build logic. It only:
#   1. checks out the code,
#   2. provides a Python interpreter,
#   3. runs `make ci`.
#
# `make ci` builds the repo-local virtualenv (.venv/) from that interpreter and
# installs the pinned `pre-commit` from requirements-dev.txt into it, exactly as
# a developer's `make setup` does — so there is nothing to install globally here.
#
# All actual checks live in the Makefile (`make ci`) and run identically on a
# developer laptop and in GitHub Actions (.github/workflows/ci.yml). To change
# WHAT runs in CI, edit the Makefile and .pre-commit-config.yaml — not this
# file. The only things that belong here are platform-specific concerns that
# cannot live in a portable script: triggers, the agent image, and
# prerequisite installation.
#
# Determinism: tool versions are pinned (Python below; `pre-commit` in
# requirements-dev.txt; hook versions via `rev` in .pre-commit-config.yaml).
# Bump them deliberately.

trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - develop

pool:
  vmImage: ubuntu-latest

steps:
  # Interpreter used to build .venv. Any version >= 3.10 works (see MIN_PYTHON
  # in the Makefile); it is pinned here only for reproducible runs, not because
  # the hooks need this exact version.
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.14"

  # The .NET SDK. useGlobalJson points the task at the same global.json the build itself resolves
  # through, so the agent compiles with exactly the pinned SDK and `make check-dotnet` cannot fail
  # here. This is the counterpart of actions/setup-dotnet in .github/workflows/ci.yml, and it exists
  # for the same reason UsePythonVersion does: installing a prerequisite toolchain is an agent concern
  # that cannot live in a portable script. The Makefile only verifies the SDK; it never installs one.
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      useGlobalJson: true

  # Cache pre-commit hook environments keyed on the config so unchanged hooks
  # are not rebuilt on every run.
  - task: Cache@2
    inputs:
      key: 'pre-commit | "$(Agent.OS)" | .pre-commit-config.yaml'
      path: $(HOME)/.cache/pre-commit

  # The single entrypoint. Everything CI does is defined in the Makefile.
  - script: make ci
    displayName: make ci

  # `make ci` writes a TRX report per test module and one merged Cobertura report; these two tasks are
  # what turn them into the Tests and Code Coverage tabs on the run. Azure DevOps renders both formats
  # first-class, so there is nothing to publish as a plain artifact here — unlike GitHub Actions, whose
  # workflow uploads the same files as a downloadable zip because it has no such UI.
  #
  # succeededOrFailed(), because the run worth reading the results of is the one that failed; make has
  # already decided the build's outcome by then, so neither task is allowed to influence it —
  # failTaskOnFailedTests stays off and an empty coverage file is not an error. Both are legitimately
  # absent when `make ci` stopped in `lint`, which each task reports as a warning.
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    displayName: Publish test results
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: artifacts/test-results/*.trx
      mergeTestResults: true
      failTaskOnFailedTests: false

  - task: PublishCodeCoverageResults@2
    condition: succeededOrFailed()
    displayName: Publish code coverage
    inputs:
      summaryFileLocation: artifacts/coverage/Cobertura.xml
      pathToSources: $(Build.SourcesDirectory)
      failIfCoverageEmpty: false
